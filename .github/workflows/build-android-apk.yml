name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  NODE_VERSION: 24

jobs:
  build-android:
    name: Build STOCKASTICS APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Prepare PNG app assets
        run: |
          set -e
          test -f assets/icon.jpg
          sudo apt-get update
          sudo apt-get install -y imagemagick
          # Ubuntu's imagemagick package currently provides ImageMagick 6,
          # where the executable is `convert`, not the ImageMagick 7 `magick` wrapper.
          command -v convert
          convert assets/icon.jpg -strip -define png:color-type=6 assets/icon.png
          test -s assets/icon.png
          file assets/icon.png
          identify assets/icon.png

      - name: Install dependencies
        run: npm install

      - name: Force Expo-compatible Worklets version
        run: npm install react-native-worklets@0.10.1 --save-exact

      - name: Verify Expo dependency versions
        run: npx expo install --check

      - name: Run Expo Doctor
        run: npx expo-doctor

      - name: Verify resolved Worklets version
        run: |
          npm ls react-native-worklets --depth=0
          node -e "const p=require('./node_modules/react-native-worklets/package.json'); if(p.version !== '0.10.1') { console.error('Expected react-native-worklets 0.10.1, found '+p.version); process.exit(1); }"

      - name: Setup Expo/EAS CLI
        run: npm install --global eas-cli@latest

      - name: Verify Expo authentication
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas whoami

      - name: Initialize or link EAS project
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas init --account capitalshield --non-interactive

      - name: Build Android APK with EAS
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas build --platform android --profile preview --clear-cache --non-interactive --wait

      - name: Build summary
        if: always()
        run: |
          echo "STOCKASTICS Android APK build workflow completed."
          echo "Check the EAS build URL printed by the EAS CLI above for the APK download."
